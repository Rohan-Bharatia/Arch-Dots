# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭╴](fg:{{colors.outline.default.hex}})\
$os\
$shell\
$username\
$hostname\
$sudo\
$directory\
$direnv\
$php\
$python\
$git_branch$git_commit$git_state$git_metrics$git_status\
[ ](fg:{{colors.surface_container_low.default.hex}})\
$fill\
$fill\
[ ](fg:{{colors.surface_container_low.default.hex}})\
$status\
$jobs\
$memory_usage\
$cmd_duration\
$battery\
$time\
$line_break\
\
[╰╴](fg:{{colors.outline.default.hex}})\
[$character]($style)"""

# move the rest of the prompt to the right
right_format = """
[$localip]($style)"""

# Inserts a blank line between shell prompts:
add_newline = true

palette = 'colors'

[palettes.colors]
color1 = '{{colors.primary_fixed_dim.default.hex}}'
color2 = '{{colors.on_primary.default.hex}}'
color3 = '{{colors.on_surface_variant.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary_container.default.hex}}'
color6 = '{{colors.surface_dim.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.primary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'
color10 = '{{colors.surface_container_low.default.hex}}'
color11 = '{{colors.outline.default.hex}}'
color12 = '{{colors.outline_variant.default.hex}}'
color13 = '{{colors.on_surface.default.hex}}'
color14 = '{{colors.error.default.hex}}'
color15 = '{{colors.error_container.default.hex}}'
color16 = '{{colors.secondary.default.hex}}'
green = '{{colors.tertiary_fixed.default.hex}}'
red = '{{colors.error.default.hex}}'
yellow = '{{colors.tertiary.default.hex}}'
cyan = '{{colors.secondary.default.hex}}'
blue = '{{colors.primary.default.hex}}'
purple = '{{colors.tertiary_container.default.hex}}'
orange = '{{colors.error_container.default.hex}}'

# Customization and activation of some modules:
# Listed in the order of their position in the module row above
[os]
format = "[](fg:color10)[$symbol]($style)(bg:color10)"
style = "fg:color13 bg:color10"
disabled = false

[os.symbols]
AIX = "AIX "
Alpaquita = "\uf26a " # \uf26a  # \ue3a5\ue390 
AlmaLinux = "\uf31d " # 
Alpine = "\uf300 " # ""
Amazon = "\uf270 " # ""
Android = "\ue70e " # ""
Arch = "\uf303 " # ""
Artix = "\uf31f " # 
CentOS = "\uf304 " # ""
Debian = "\uf306 " # ""
DragonFly = "\ueef8 " #    🐉
Emscripten = "\u26A1 " # ⚡
EndeavourOS = "\uf322 " # "" # 
Fedora = "\uf30a " # ""
FreeBSD = "\uf30c " # ""
Garuda = "\uf337 " # ""
Gentoo = "\uf30d " # ""
HardenedBSD = "\uf132 " # 
Illumos = "\uf326 " # "🐦"
Kali = "\uf327 " # 
Linux = "\uf17c " # ""
Mabox = "\uf1b2 " #  📦
Macos = "\uf302 " # ""
Manjaro = "\uf312 " # ""
Mariner = "\ue7ae " # \ue7ae 
MidnightBSD = "\ue3e0 " # 🌘
Mint = "\uf30e " # ""
NetBSD = "\u2691 " # ⚑
NixOS = "\uf313 " # ""
OpenBSD = "\uf328 " # ""
OpenCloudOS = "\uf0c2 " # 
openEuler = "\u2208 " # \u2208 ∈
openSUSE = "\uf314 " # ""
