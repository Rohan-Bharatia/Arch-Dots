[shell]
format = '[$indicator]($style)()'
style = 'fg:color12 bg:color10'
# empty indicator (''): e.g. if you do not want to see indicator for your standard shell
zsh_indicator = '%_ ' # '%_ ' '󰰶 '
bash_indicator = '\$_ ' # "\uebca " ' ' '\$_ '
fish_indicator = '>> ' # "\uee41 " '󰈺 ' '>>_ '
powershell_indicator = '>_ ' # "\uebc7 " ' ' '>_'
unknown_indicator = '?_ ' # '?_ ' ' '
disabled = true # set to false if you want to see the shell indicator

[username]
format = '[ ](fg:green bold bg:color10)[$user]($style)[ ](bg:color10)'
style_user = 'fg:green bold bg:color10'
style_root = 'fg:red bold bg:color10'
show_always = false
disabled = false

[hostname]
format = '[$ssh_symbol ](fg:green bold bg:color10)[$hostname](fg:green bold bg:color10)[ ](bg:color10)'
ssh_only = true
ssh_symbol = '' # '⇒' # ' ' # 'ﬁ⇒'
#trim_at = '.companyname.com'
disabled = false

[sudo]
format = '[ ](fg:red bold bg:color10)[ $symbol]($style)'
style = 'fg:red bold bg:color10'
symbol = ' ' # ' ❯ '
disabled = false

[directory]
format = '[ ](fg:cyan bold bg:color10)[$read_only]($read_only_style)[$repo_root]($repo_root_style)[$path ]($style)'
style = 'fg:cyan bold bg:color10'
home_symbol = ' ~'
read_only = ' ' # ' ' # ' ''
read_only_style = 'fg:cyan bg:color10'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
repo_root_format = '[ ](fg:cyan bold bg:color10)[$read_only]($read_only_style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)'
repo_root_style = 'fg:cyan bold bg:color10'
use_os_path_sep = true
disabled = false

[direnv]
symbol = 'direnv'
style = 'fg:color11 bold bg:color10'
format = "[❯ $symbol $loaded/$allowed ]($style)"
allowed_msg = 'a' # 'ok' # '✓'
not_allowed_msg = '!a' # 'nok' # '!'
denied_msg = 'x' # '✘'
loaded_msg = '+' # "\ueabc" # \ueabc  # '->' # 'yo' # '󰗡' # \udb81\udde1 # '󱥸✓' # '󱥸✓' # 
unloaded_msg = '-' # "\ueabc!" # \ueabc ! # '->!' # 'no' # '󰅚' # '󱥸!' \udb86\udd78
disabled = false

[php]
format = "[[ \u3009](fg:color16 bg:color10)[$symbol](fg:color16 italic bg:color10)($version )]($style)"
style = 'fg:color16 bg:color10)'
symbol = "php " # \ue73d  # 󰌟

[python]
format = "[\u3009${symbol}${pyenv_prefix}(${version} )(($virtualenv) )]($style)"
style = 'fg:yellow bg:color10'
symbol = "\ue73c " # 
pyenv_version_name = true

[git_branch]
format = '[❯ $symbol $branch(:$remote_branch)]($style)[ ](bg:color10)'
style = 'fg:color14 bg:color10'
symbol = ''
#ignore_branches = ['master', 'main']

[git_commit]
format = '[\($hash$tag\)]($style)[ ](bg:color10)'
style = 'fg:color14 bg:color10'
commit_hash_length = 8
tag_symbol = '  ' # '  ''
tag_disabled = false
disabled = false

[git_metrics]
format = '[\[+$added/]($added_style)[-$deleted\]]($deleted_style)[ ](bg:color10)'
added_style = 'fg:color14 bg:color10'
deleted_style = 'fg:color14 bg:color10'
disabled = false

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = 'fg:color14 bg:color10'
conflicted = '[${count} ](fg:red bg:color10)'
ahead = '[⇡${count} ](fg:yellow bg:color10)'
behind = '[⇣${count} ](fg:yellow bg:color10)'
diverged = '[⇕${ahead_count}⇡${behind_count}⇣ ](fg:yellow bg:color10)' # ⇕ ↕ ⇳ 󰹹 󰹺 󰧈
up_to_date = '[✓ ](fg:green bg:color10)'
untracked = '[ﳇ${count} ](fg:red bg:color10)' # ' ' # '? '
stashed = '[${count} ](fg:color15 bg:color10)' # '📦 '# ' ' # ' ' # ' ' # ' '
modified = '[󰷉${count} ](fg:color9 bg:color10)' # '📝' # '! ' #  #  # 
staged = '[${count} ](fg:green bg:color10)' # '+ '
renamed = '[${count} ](fg:yellow bg:color10)' # ' ' # '﫦' # ᴂ #  #  #  # ﳳ
deleted = '[﯊${count} ](fg:orange bg:color10)' # '🗑 ' '- '
disabled = false

[fill]
style = 'fg:color11'
symbol = "\u2500" # "\u2500" "─" # no line: ' '

[status]
format = '[$symbol $status $hex_status(  $signal_number-$signal_name)]($style)'
style = 'fg:red bg:color10'
symbol = ' ✘'
disabled = false

[jobs]
format = "[ \ueab5 ](fg:blue bold bg:color10)[$symbol $number]($style)"
style = 'fg:blue bg:color10'
symbol = "\ueb7b" # \ueb7b  \uef0c 省 # '廒' # '󰜎' # ''
symbol_threshold = 1
number_threshold = 2
disabled = false

[memory_usage]
format = "[ \ueab5 ](fg:purple bold bg:color10)[$symbol ${ram} ${swap}]($style)"
style = 'fg:purple bg:color10'
symbol = '﬙ 北' # '﬙ 痢' # '﬙ / 󰾵' # '󰍛 󰾵' # '﬙ 󰾴' # '﬙ 󰾶' # '﬙ 󰾷' '﬙ 󰣂'
threshold = 75
disabled = false

[cmd_duration]
format = "[ \ueab5 \uf017 $duration]($style)" # \ueab5 \uf017   
style = 'fg:yellow bg:color10'
min_time = 500
disabled = false

[battery]
format = "[ \ueab5 $symbol$percentage]($style)"
full_symbol = '󰁹 '
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '
unknown_symbol = '󰁽? '
empty_symbol = '󰂎 '
disabled = true # set to 'false', if you want to see the battery status

[[battery.display]]
threshold = 100 # show always
style = 'fg:color11 bg:color10'

[time]
format = "[ \ueab5 $time]($style)"
style = 'fg:color11 bg:color10'
disabled = true # set to 'false', if you want to see the time

[localip]
format = '[$localipv4](fg:green bold)'
ssh_only = true
disabled = false
